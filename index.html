<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WatchAnimeWorld - Premium Streaming</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
    background-color: #0d0e12; 
    color: #f3f4f6; 
    font-family: 'Inter', sans-serif; 
    line-height: 1.5;
}

/* Header UI */
header { 
    background: rgba(18, 20, 29, 0.8); 
    backdrop-filter: blur(12px);
    padding: 18px 8%; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
    position: sticky;
    top: 0;
    z-index: 100;
}
.logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.logo span { color: #ff3d71; }
nav a { 
    color: #9ca3af; 
    text-decoration: none; 
    margin-left: 28px; 
    font-weight: 600;
    font-size: 15px;
    transition: color 0.3s;
}
nav a:hover { color: #ffffff; }

/* Hero Section */
.hero { 
    padding: 90px 8% 60px; 
    background: radial-gradient(circle at top right, rgba(255, 61, 113, 0.15), transparent 40%),
                radial-gradient(circle at top left, rgba(30, 27, 75, 0.4), transparent 50%);
    text-align: center;
}
.hero h1 { 
    font-size: 48px; 
    font-weight: 800;
    margin-bottom: 16px; 
    background: linear-gradient(135deg, #ffffff 0%, #9ca3af 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.hero p { color: #9ca3af; margin-bottom: 35px; font-size: 17px; }
.search-container {
    position: relative;
    max-width: 550px;
    margin: 0 auto;
}
.search { 
    width: 100%; 
    padding: 18px 24px; 
    border: 1px solid rgba(255, 255, 255, 0.12); 
    border-radius: 14px; 
    font-size: 15px; 
    outline: none; 
    background: rgba(21, 23, 35, 0.7);
    color: #fff;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
}
.search:focus {
    border-color: #ff3d71;
    box-shadow: 0 0 20px rgba(255, 61, 113, 0.25);
}

/* Movie Grid */
section { padding: 40px 8%; }
.title { 
    font-size: 22px; 
    font-weight: 700; 
    margin-bottom: 28px; 
    letter-spacing: -0.3px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.title::before {
    content: '';
    width: 4px;
    height: 22px;
    background: #ff3d71;
    border-radius: 2px;
}
.grid { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
    gap: 28px; 
}
.anime { 
    background: #151723; 
    border-radius: 16px; 
    overflow: hidden; 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
    border: 1px solid rgba(255, 255, 255, 0.05);
    position: relative;
}
.anime:hover { 
    transform: translateY(-8px); 
    box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6); 
    border-color: rgba(255, 61, 113, 0.4);
}
.poster { 
    height: 300px; 
    background: #1e202e; 
    overflow: hidden; 
    position: relative;
}
.poster img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    display: block; 
    transition: transform 0.5s ease;
}
.anime:hover .poster img {
    transform: scale(1.06);
}
.info { padding: 16px; }
.info h3 { 
    font-size: 15px; 
    font-weight: 600;
    margin-bottom: 6px; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
}
.rating { 
    color: #fbbf24; 
    margin-bottom: 14px; 
    font-size: 13px; 
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 4px;
}
.watch-btn { 
    display: block; 
    width: 100%; 
    padding: 12px; 
    text-align: center; 
    background: linear-gradient(135deg, #ff3d71, #e02e5e); 
    color: white; 
    border: 0; 
    border-radius: 10px; 
    font-weight: 700; 
    font-size: 14px;
    cursor: pointer; 
    transition: all 0.3s ease;
}
.watch-btn:hover { 
    opacity: 0.9;
    box-shadow: 0 4px 15px rgba(255, 61, 113, 0.4);
}

/* Details View */
#details { display: none; }
.details-box { 
    background: #151723; 
    border-radius: 20px; 
    padding: 35px; 
    max-width: 1000px; 
    margin: auto; 
    border: 1px solid rgba(255, 255, 255, 0.08);
}
.back { 
    display: inline-flex; 
    align-items: center;
    gap: 8px;
    margin-bottom: 25px; 
    color: #ff3d71; 
    font-weight: 600;
    cursor: pointer; 
    transition: transform 0.2s;
}
.back:hover { transform: translateX(-4px); }
.details-title { font-size: 34px; font-weight: 800; margin-bottom: 15px; }

.media-container { 
    width: 100%; 
    height: 520px; 
    background: #000; 
    border-radius: 14px; 
    overflow: hidden; 
    margin-top: 20px; 
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}
video, iframe { width: 100%; height: 100%; border: 0; display: block; }

.overview-sec { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 25px; }
.overview-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.overview-desc { color: #9ca3af; line-height: 1.8; font-size: 15px; margin-bottom: 25px; }
.info-group { margin-bottom: 18px; }
.info-label { color: #6b7280; font-size: 13px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
.info-value { color: #e5e7eb; font-size: 15px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.tag { background: rgba(255,255,255,0.06); padding: 6px 14px; border-radius: 8px; font-size: 13px; color: #d1d5db; border: 1px solid rgba(255,255,255,0.05); }

footer { text-align: center; padding: 40px; margin-top: 50px; background: #090a0d; color: #4b5563; font-size: 14px; border-top: 1px solid rgba(255,255,255,0.05); }
</style>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>

<header>
<div class="logo">Watch<span>Anime</span></div>
<nav>
    <a href="#" onclick="showHome()">Home</a>
    <a href="#" onclick="showHome()">Categories</a>
</nav>
</header>

<div id="home">
<div class="hero">
<h1>Unlimited Movies & Anime</h1>
<p>Stream high-quality content updated dynamically.</p>
<div class="search-container">
    <input id="search" class="search" type="text" placeholder="Search for movies...">
</div>
</div>

<section id="anime">
<h2 class="title">Trending Now</h2>
<div class="grid" id="movieGrid"></div>
</section>
</div>

<section id="details">
<div class="details-box">
<span class="back" onclick="showHome()">← Back to Home</span>
<h1 id="animeTitle" class="details-title">Loading...</h1>

<div class="media-container" id="mediaBox"></div>

<div class="overview-sec">
    <div class="overview-title">Overview</div>
    <p id="movieDesc" class="overview-desc">Loading description...</p>

    <div class="info-group">
        <div class="info-label">Runtime</div>
        <div class="info-value" id="movieRuntime">-</div>
    </div>

    <div class="info-group">
        <div class="info-label">Genres</div>
        <div class="tags" id="movieGenres"></div>
    </div>

    <div class="info-group">
        <div class="info-label">Production</div>
        <div class="info-value" id="movieProduction">-</div>
    </div>
</div>
</div>
</section>

<footer>
    <p>&copy; 2026 WatchAnimeWorld. All rights reserved.</p>
</footer>

<script>
const TMDB_API_KEY = "7ddf0f77a2643442a53c286ea8391a81"; 
const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

const animeList = [
    { tmdbId: 1084242, url: "https://fuckme.dragonballzfans.xyz/11abc69bb14e1ce94c5c2284e6d71619/164cc7ac38d81ad555676b3e921e118c.m3u8" },
    { tmdbId: 269149,  url: "https://fuckme.dragonballzfans.xyz/4ed0a5b0e612a69f0f80ce4ad1337df1/2729a8e62ad97c5bc841722b33597569.m3u8" },
    { tmdbId: 1007757, url: "https://fuckme.dragonballzfans.xyz/8476111ce1283036af4e67f8da549cb5/f693e2a5a468d59e1ac04ebacb58e27e.m3u8" },
    { tmdbId: 980431,  url: "https://fuckme.dragonballzfans.xyz/a9a9b21bcebf0a1b9c6e76a4684df1c3/19a937ea66c4600b694889257b6239c7.m3u8" }
];

let fetchedMovies = {};
let hls = null;

async function loadMovies() {
    const grid = document.getElementById("movieGrid");
    grid.innerHTML = "";

    for (let item of animeList) {
        try {
            const res = await fetch(`https://api.themoviedb.org/3/movie/${item.tmdbId}?api_key=${TMDB_API_KEY}`);
            const data = await res.json();
            
            fetchedMovies[item.tmdbId] = { ...data, videoUrl: item.url };

            const posterImg = data.poster_path ? IMAGE_BASE_URL + data.poster_path : '';
            
            grid.innerHTML += `
                <div class="anime" data-name="${data.title}">
                    <div class="poster"><img src="${posterImg}" alt="${data.title}"></div>
                    <div class="info">
                        <h3>${data.title}</h3>
                        <div class="rating">★ ${data.vote_average ? data.vote_average.toFixed(1) : 'N/A'}</div>
                        <button class="watch-btn" onclick="openAnime(${item.tmdbId})">Watch Now</button>
                    </div>
                </div>
            `;
        } catch (err) {
            console.error("Error fetching TMDB data:", err);
        }
    }
}

function openAnime(tmdbId) {
    const movie = fetchedMovies[tmdbId];
    if (!movie) return;

    document.getElementById("home").style.display = "none";
    document.getElementById("details").style.display = "block";
    document.getElementById("animeTitle").textContent = movie.title;
    document.getElementById("movieDesc").textContent = movie.overview || "No description available.";
    
    const hours = Math.floor(movie.runtime / 60);
    const mins = movie.runtime % 60;
    document.getElementById("movieRuntime").textContent = `${hours}h ${mins}m`;

    document.getElementById("movieProduction").textContent = movie.production_companies ? movie.production_companies.map(c => c.name).join(", ") : "N/A";

    const genreBox = document.getElementById("movieGenres");
    genreBox.innerHTML = movie.genres ? movie.genres.map(g => `<span class="tag">${g.name}</span>`).join("") : "";

    loadVideo(movie.videoUrl);
    window.scrollTo(0, 0);
}

function loadVideo(url) {
    const mediaBox = document.getElementById("mediaBox");
    if (hls) { hls.destroy(); hls = null; }
    mediaBox.innerHTML = "";

    if (!url) {
        mediaBox.innerHTML = "<p style='padding:20px; text-align:center;'>Video link unavailable</p>";
        return;
    }

    if (Hls.isSupported() && url.endsWith(".m3u8")) {
        mediaBox.innerHTML = `<video id="videoPlayer" controls playsinline crossorigin="anonymous"></video>`;
        const video = document.getElementById("videoPlayer");
        
        hls = new Hls({
            renderTextTracksNatively: true,
            subtitlePreference: { lang: 'en' }
        });

        hls.loadSource(url);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (hls.subtitleTracks.length > 0) {
                hls.subtitleTrack = 0;
            }
            video.play().catch(()=>{});
        });
    } else {
        mediaBox.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay"></iframe>`;
    }
}

function showHome() {
    document.getElementById("details").style.display = "none";
    document.getElementById("home").style.display = "block";
    document.getElementById("mediaBox").innerHTML = "";
    if (hls) { hls.destroy(); hls = null; }
    window.scrollTo(0, 0);
}

loadMovies();
</script>

</body>
</html>
