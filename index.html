<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WatchAnimeWorld - API Powered</title>

<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:#09090f; color:#fff; font-family:Arial,sans-serif; }
header{ background:#12121b; padding:18px 6%; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #252532; }
.logo{ font-size:25px; font-weight:bold; }
.logo span{ color:#ff3d71; }
nav a{ color:#ddd; text-decoration:none; margin-left:20px; }
.hero{ padding:70px 6%; background:linear-gradient(135deg,#191927,#28121e); }
.hero h1{ font-size:43px; margin-bottom:12px; }
.hero p{ color:#aaa; margin-bottom:25px; }
.search{ width:100%; max-width:600px; padding:16px; border:0; border-radius:8px; font-size:16px; outline:none; }
section{ padding:45px 6%; }
.title{ font-size:26px; margin-bottom:25px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:22px; }
.anime{ background:#15151f; border-radius:12px; overflow:hidden; transition:.25s; }
.anime:hover{ transform:translateY(-7px); box-shadow:0 10px 30px rgba(0,0,0,.4); }
.poster{ height:270px; background:#272735; overflow:hidden; }
.poster img{ width:100%; height:100%; object-fit:cover; display:block; }
.info{ padding:14px; }
.info h3{ font-size:16px; margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rating{ color:#ffc107; margin-bottom:10px; font-size:14px; }
.watch-btn{ display:block; width:100%; padding:11px; text-align:center; background:#ff3d71; color:white; border:0; border-radius:7px; font-weight:bold; cursor:pointer; }
.watch-btn:hover{ background:#ff1f5b; }
#details{ display:none; }
.details-box{ background:#15151f; border-radius:14px; padding:30px; max-width:1000px; margin:auto; }
.back{ display:inline-block; margin-bottom:25px; color:#ff3d71; cursor:pointer; }
.details-title{ font-size:32px; margin-bottom:10px; }

.overview-sec { margin-top: 25px; border-top: 1px solid #252532; padding-top: 20px; }
.overview-title { font-size: 20px; margin-bottom: 15px; }
.overview-desc { color: #ccc; line-height: 1.7; font-size: 15px; margin-bottom: 20px; }
.info-group { margin-bottom: 15px; }
.info-label { color: #888; font-size: 14px; margin-bottom: 5px; }
.info-value { color: #fff; font-size: 15px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
.tag { background: #252532; padding: 5px 12px; border-radius: 6px; font-size: 13px; color: #ddd; }

.media-container { width: 100%; height: 500px; background: #000; border-radius: 10px; overflow: hidden; margin-top: 20px; }
video, iframe { width: 100%; height: 100%; border: 0; display: block; }

footer{ text-align:center; padding:30px; margin-top:30px; background:#12121b; color:#777; }
</style>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>

<header>
<div class="logo">Watch<span>Anime</span></div>
<nav>
    <a href="#" onclick="showHome()">Home</a>
    <a href="#" onclick="showHome()">Categories</a>
</nav>
</header>

<div id="home">
<div class="hero">
<h1>Watch Movies Online</h1>
<p>Stream automatically updated movies instantly.</p>
<input id="search" class="search" type="text" placeholder="Search...">
</div>

<section id="anime">
<h2 class="title">Trending Movies</h2>
<div class="grid" id="movieGrid"></div>
</section>
</div>

<section id="details">
<div class="details-box">
<span class="back" onclick="showHome()">← Back</span>
<h1 id="animeTitle" class="details-title">Loading...</h1>

<div class="media-container" id="mediaBox"></div>

<div class="overview-sec">
    <div class="overview-title">Overview</div>
    <p id="movieDesc" class="overview-desc">Loading description...</p>

    <div class="info-group">
        <div class="info-label">Runtime</div>
        <div class="info-value" id="movieRuntime">-</div>
    </div>

    <div class="info-group">
        <div class="info-label">Genres</div>
        <div class="tags" id="movieGenres"></div>
    </div>

    <div class="info-group">
        <div class="info-label">Production</div>
        <div class="info-value" id="movieProduction">-</div>
    </div>
</div>
</div>
</section>

<script>
const TMDB_API_KEY = "7ddf0f77a2643442a53c286ea8391a81"; 
const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

const animeList = [
    { tmdbId: 1084242, url: "https://fuckme.dragonballzfans.xyz/11abc69bb14e1ce94c5c2284e6d71619/164cc7ac38d81ad555676b3e921e118c.m3u8" },
    { tmdbId: 269149,  url: "https://fuckme.dragonballzfans.xyz/4ed0a5b0e612a69f0f80ce4ad1337df1/2729a8e62ad97c5bc841722b33597569.m3u8" },
    {tmdbId: 980431, url: "https://fuckme.dragonballzfans.xyz/8476111ce1283036af4e67f8da549cb5/f693e2a5a468d59e1ac04ebacb58e27e.m3u8" },
    {tmdbId: 1007757, url: "https: //fuckme.dragonballzfans.xyz/a9a9b21bcebf0a1b9c6e76a4684df1c3/19a937ea66c4600b694889257b6239c7.m3u8" }
];

let fetchedMovies = {};
let hls = null;

async function loadMovies() {
    const grid = document.getElementById("movieGrid");
    grid.innerHTML = "";

    for (let item of animeList) {
        try {
            const res = await fetch(`https://api.themoviedb.org/3/movie/${item.tmdbId}?api_key=${TMDB_API_KEY}`);
            const data = await res.json();
            
            fetchedMovies[item.tmdbId] = { ...data, videoUrl: item.url };

            const posterImg = data.poster_path ? IMAGE_BASE_URL + data.poster_path : '';
            
            grid.innerHTML += `
                <div class="anime" data-name="${data.title}">
                    <div class="poster"><img src="${posterImg}" alt="${data.title}"></div>
                    <div class="info">
                        <h3>${data.title}</h3>
                        <div class="rating">★ ${data.vote_average.toFixed(1)}</div>
                        <button class="watch-btn" onclick="openAnime(${item.tmdbId})">Watch Now</button>
                    </div>
                </div>
            `;
        } catch (err) {
            console.error("Error fetching TMDB data:", err);
        }
    }
}

function openAnime(tmdbId) {
    const movie = fetchedMovies[tmdbId];
    if (!movie) return;

    document.getElementById("home").style.display = "none";
    document.getElementById("details").style.display = "block";
    document.getElementById("animeTitle").textContent = movie.title;
    document.getElementById("movieDesc").textContent = movie.overview || "No description available.";
    
    const hours = Math.floor(movie.runtime / 60);
    const mins = movie.runtime % 60;
    document.getElementById("movieRuntime").textContent = `${hours}h ${mins}m`;

    document.getElementById("movieProduction").textContent = movie.production_companies.map(c => c.name).join(", ") || "N/A";

    const genreBox = document.getElementById("movieGenres");
    genreBox.innerHTML = movie.genres.map(g => `<span class="tag">${g.name}</span>`).join("");

    loadVideo(movie.videoUrl);
    window.scrollTo(0, 0);
}

function loadVideo(url) {
    const mediaBox = document.getElementById("mediaBox");
    if (hls) { hls.destroy(); hls = null; }
    mediaBox.innerHTML = "";

    if (!url) {
        mediaBox.innerHTML = "<p style='padding:20px; text-align:center;'>Video link unavailable</p>";
        return;
    }

    if (Hls.isSupported() && url.endsWith(".m3u8")) {
        mediaBox.innerHTML = `<video id="videoPlayer" controls playsinline crossorigin="anonymous"></video>`;
        const video = document.getElementById("videoPlayer");
        
        hls = new Hls({
            renderTextTracksNatively: true,
            subtitlePreference: { lang: 'en' }
        });

        hls.loadSource(url);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
            if (hls.subtitleTracks.length > 0) {
                hls.subtitleTrack = 0;
            }
            video.play().catch(()=>{});
        });
    } else {
        mediaBox.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay"></iframe>`;
    }
}

function showHome() {
    document.getElementById("details").style.display = "none";
    document.getElementById("home").style.display = "block";
    document.getElementById("mediaBox").innerHTML = "";
    if (hls) { hls.destroy(); hls = null; }
    window.scrollTo(0, 0);
}

loadMovies();
</script>

</body>
</html>
