<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY ANIME</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #090d16;
            color: #fff;
            font-family: system-ui, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* بەشی پلەیەر */
        .player-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .custom-watermark {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            pointer-events: none;
            background: rgba(9, 13, 22, 0.85);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #38bdf8;
        }
        .wm-main { color: #38bdf8; font-weight: bold; font-size: 14px; }
        .wm-sub { color: #facc15; font-size: 11px; }

        /* بەشی لیستی ئەنیمییەکان */
        .list-box {
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .list-title {
            font-size: 18px;
            margin-bottom: 12px;
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
            padding-bottom: 5px;
        }

        .anime-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: #1f2937;
            color: #fff;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            text-align: right;
            font-size: 15px;
            transition: 0.2s;
        }

        .anime-btn:hover { background: #374151; }
        .anime-btn.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- پلەیەرەکە -->
        <div class="player-box">
            <iframe id="videoPlayer" src="https://drive.google.com/file/d/1skTvxcLPygh-flfeeVbNmeOb8jTe4JuB/preview" allow="autoplay"></iframe>
            <div class="custom-watermark">
                <div class="wm-main">MY ANIME</div>
                <div class="wm-sub">کوردی / Kurdish Streaming</div>
            </div>
        </div>

        <!-- لیستی دیارکراوی ئەنیمییەکان -->
        <div class="list-box">
            <div class="list-title">لیستی ئەنیمییەکان</div>
            <div id="buttonsContainer"></div>
        </div>
    </div>

    <script>
        // داتای ئەنیمییەکان لەگەڵ ناوی دیاریکراو
        const animeList = [
            { name: "ئەنیمی 1 (Google Drive)", url: "https://drive.google.com/file/d/1skTvxcLPygh-flfeeVbNmeOb8jTe4JuB/preview" },
            { name: "ئەنیمی 2 (ID: 269149)", url: "https://fuckme.dragonballzfans.xyz/4ed0a5b0e612a69f0f80ce4ad1337df1/2729a8e62ad97c5bc841722b33597569.m3u8" },
            { name: "ئەنیمی 3 (ID: 1007757)", url: "https://fuckme.dragonballzfans.xyz/8476111ce1283036af4e67f8da549cb5/f693e2a5a468d59e1ac04ebacb58e27e.m3u8" },
            { name: "ئەنیمی 4 (ID: 980431)", url: "https://fuckme.dragonballzfans.xyz/a9a9b21bcebf0a1b9c6e76a4684df1c3/19a937ea66c4600b694889257b6239c7.m3u8" },
            { name: "ئەنیمی 5 (ID: 862)", url: "https://fuckme.dragonballzfans.xyz/c701a7210f20f24e67f4772e171147ce/2831bd9e9b148524acf1999c9a0fc3a0.m3u8" },
            { name: "ئەنیمی 6 (ID: 863)", url: "https://fuckme.dragonballzfans.xyz/eaeb46d9c82604960d90c67a6aea0ada/e3fd4e6692b6717a60a064f2c56a9cab.m3u8" },
            { name: "ئەنیمی 7 (ID: 10193)", url: "https://fuckme.dragonballzfans.xyz/9997613d6552b9b750654e7019f5e5a1/44258401a36cada4c2b45eec1bb96e07.m3u8" },
            { name: "ئەنیمی 8 (ID: 301528)", url: "https://fuckme.dragonballzfans.xyz/f86a36f28fd75920c2457561f7537329/c555fec70eeccc00716e18aaae1aa15a.m3u8" }
        ];

        const player = document.getElementById('videoPlayer');
        const container = document.getElementById('buttonsContainer');

        // دروستکردنی دوگمەکان بە ڕوونی
        animeList.forEach((anime, index) => {
            const btn = document.createElement('button');
            btn.className = `anime-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = anime.name;

            btn.onclick = () => {
                document.querySelectorAll('.anime-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                player.src = anime.url;
            };

            container.appendChild(btn);
        });
    </script>

</body>
</html>
